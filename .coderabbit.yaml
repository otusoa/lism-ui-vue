language: 'ja-JP'

reviews:
  profile: 'chill'
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - 'chore(main): release'
    base_branches:
      - 'main'
      - 'staging'

chat:
  auto_reply: true
