name: Release Please and npm publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      full: true

  release:
    needs: ci
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      core_released: ${{ steps.release.outputs.release_created }}
      nuxt_released: ${{ steps.release.outputs['apps/lism-ui-vue-nuxt--release_created'] }}
      release_sha: ${{ steps.release.outputs.sha || steps.release.outputs['apps/lism-ui-vue-nuxt--sha'] }}
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - name: リリース用トークンの確認
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo '::error::RELEASE_PLEASE_TOKEN を設定してください。リリースPRのCI実行に必要です。'
            exit 1
          fi

      - name: リリースPRとGitHub Releaseの作成
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish-${{ needs.release.outputs.release_sha }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.release_sha }}
          persist-credentials: false

      - name: pnpmのセットアップ
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          version: 11
          install: false

      - name: Node.jsのセットアップ
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile

      - name: ビルドの実行
        run: pnpm build

      - name: Nuxtモジュールの準備
        run: pnpm --filter @lism-ui-vue/nuxt run dev:prepare

      - name: 本体の公開
        if: needs.release.outputs.core_released == 'true'
        run: |
          DIST_TAG=$(node -p "require('./package.json').version.split('-')[1]?.split('.')[0] || 'latest'")
          pnpm publish -r --filter lism-ui-vue --access public --no-git-checks --provenance --tag "$DIST_TAG" --registry=https://registry.npmjs.org

      - name: Nuxtモジュールの公開
        if: needs.release.outputs.nuxt_released == 'true'
        run: |
          DIST_TAG=$(node -p "require('./apps/lism-ui-vue-nuxt/package.json').version.split('-')[1]?.split('.')[0] || 'latest'")
          pnpm publish -r --filter @lism-ui-vue/nuxt --access public --no-git-checks --provenance --tag "$DIST_TAG" --registry=https://registry.npmjs.org
