name: Publish to npm

on:
  push:
    tags:
      - '*@v*'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    name: パブリッシュの実行
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDCによるnpm認証（Provenance）に必要
      contents: read # ソースの読み取りに必要

    steps:
      - uses: actions/checkout@v4

      - name: pnpmのセットアップ
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile

      - name: Prepare Nuxt
        run: pnpm exec nuxi prepare
        working-directory: apps/lism-ui-vue-nuxt # 該当のディレクトリを指定

      - name: ビルドの実行
        run: pnpm build

      - name: npmへパブリッシュ
        shell: bash
        run: |
          REF="${{ github.ref_name }}"
          # タグ名からパッケージ名を抽出 (例: @scope/pkg@v1.0.0 -> @scope/pkg)
          PKG=$(echo "$REF" | sed 's/@v[0-9].*//')
          # タグ名からバージョンを抽出 (例: @scope/pkg@v1.0.0 -> 1.0.0)
          VER=$(echo "$REF" | sed 's/.*@v//')
          
          # タグ名からリリース識別子 (alpha, beta, rc, next) を抽出して dist-tag を決定
          TAG=$(echo "$REF" | sed -n 's/.*-\(alpha\|beta\|rc\|next\).*/\1/p')
          TAG=${TAG:-latest}

          echo "Publishing $PKG@$VER with tag: $TAG"
          pnpm publish -r --filter "$PKG" --access public --no-git-checks --provenance --tag "$TAG"

          # 常に最新のバージョンにlatestをつけるように調整
          # ただし、安定版が既にlatestにある場合は pre-release版で上書きしないようにする
          if [ "$TAG" != "latest" ]; then
            # 現在のlatestに紐づいているバージョンを取得
            CURRENT_LATEST=$(npm view "$PKG" version 2>/dev/null || echo "")
            
            # current latest が pre-release版（-alpha, -beta などを含む）であるか、
            # まだ存在しない場合は、今回の pre-release版を latest としてもタグ付けする
            if [[ -z "$CURRENT_LATEST" || "$CURRENT_LATEST" =~ -(alpha|beta|rc|next) ]]; then
              echo "Updating 'latest' tag to $VER because current latest ($CURRENT_LATEST) is a pre-release or empty."
              npm dist-tag add "$PKG@$VER" latest
            fi
          fi
