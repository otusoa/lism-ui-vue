name: Publish CLI to npm

on:
  push:
    tags:
      - 'cli-v*' # 例: cli-v0.1.0 をpushすると発火

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDCによるnpm認証（Provenance）に必要
      contents: read # ソースの読み取りに必要
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Build Go binaries
        run: |
          cd apps/cli
          mkdir -p dist
          GOOS=darwin GOARCH=amd64 go build -o dist/lism-ui-vue-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -o dist/lism-ui-vue-darwin-arm64 .
          GOOS=linux GOARCH=amd64 go build -o dist/lism-ui-vue-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o dist/lism-ui-vue-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -o dist/lism-ui-vue-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -o dist/lism-ui-vue-windows-arm64.exe .

      - name: Publish target binaries to npm
        run: |
          cd apps/cli
          node scripts/publish-npm.js
