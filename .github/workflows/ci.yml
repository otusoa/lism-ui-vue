name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      full:
        description: 全パッケージのCIを実行する
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.changes.outputs.core }}
      nuxt: ${{ steps.changes.outputs.nuxt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          filters: |
            core:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'src/**'
              - 'tsconfig.json'
              - 'tsconfig.app.json'
              - 'tsdown.config.ts'
              - 'vite.config.ts'
              - '.github/workflows/**'
              - 'release-please-config.json'
              - '.release-please-manifest.json'
            nuxt:
              - 'apps/lism-ui-vue-nuxt/**'

  ci-core:
    name: Core CI
    needs: filter
    if: inputs.full == true || needs.filter.outputs.core == 'true' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: pnpmのセットアップ
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          version: 11
          install: false

      - name: Node.jsのセットアップ
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile

      - name: Lint の実行 (oxlint)
        run: pnpm lint:oxlint

      - name: 型チェックの実行
        run: pnpm type-check

      - name: テストの実行 (Vitest)
        run: pnpm exec vitest run

      - name: ビルドの実行
        run: pnpm build

  ci-nuxt:
    name: Nuxt CI
    needs: filter
    if: inputs.full == true || needs.filter.outputs.nuxt == 'true' || needs.filter.outputs.core == 'true' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: pnpmのセットアップ
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          version: 11
          install: false

      - name: Node.jsのセットアップ
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile

      - name: ビルドの実行
        run: pnpm build

      - name: Prepare Nuxt
        run: pnpm --filter @lism-ui-vue/nuxt run dev:prepare

      - name: 'Nuxtモジュール: テストの実行'
        run: pnpm --filter @lism-ui-vue/nuxt run test
